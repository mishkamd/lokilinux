# LokiLinux — Production Docker Compose
# TimescaleDB chunk_time_interval = '1 day' (configured in init SQL)
# pgBouncer sits in front of Postgres on port 6432 for connection pooling
#
# Security posture:
#   * App containers run non-root, cap_drop: ALL, no-new-privileges,
#     read-only rootfs (+ tmpfs /tmp where the app needs scratch space).
#   * Networks are segmented; everything except the API's egress net is
#     `internal: true` (no outbound internet, no host attachment).
#   * Only frontend/api/grpc ports are published on the host — redis,
#     nats and pgBouncer are reachable only from inside the compose networks.
#
# Network map:
#   data-net  (internal) : postgres <-> pgbouncer (+ frontend direct DB access)
#   app-net   (internal) : pgbouncer / nats / redis / clickhouse <-> api / grpc / compliance
#   web-net   (internal) : api <-> frontend
#   gateway-net          : api / grpc / frontend — required for host port
#                          publishing (internal networks cannot publish ports)
#   egress-net           : api only — outbound internet for NVD/CISA feeds
#                          and workflow webhooks (no published ports)

services:

  # ============================================================================
  # DATABASE — TimescaleDB (PostgreSQL 17 + TimescaleDB extension)
  # ============================================================================

  postgres:
    image: timescale/timescaledb:2.28.1-pg17
    container_name: lokilinux-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lokilinux}
      POSTGRES_USER: ${POSTGRES_USER:-lokilinux}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lokilinux}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          pids: 200
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G

  # ============================================================================
  # CONNECTION POOLER — pgBouncer (internal port 5432, NOT published to host)
  # ============================================================================

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    container_name: lokilinux-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DB_USER: ${POSTGRES_USER:-lokilinux}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-lokilinux}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
    networks:
      - data-net
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U ${POSTGRES_USER:-lokilinux}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          pids: 64
          cpus: "0.5"
          memory: 256M

  # ============================================================================
  # MESSAGE BUS — NATS 2.10 with JetStream (ports internal-only)
  # ============================================================================

  nats:
    image: nats:2.10.29-alpine
    container_name: lokilinux-nats
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - "--js"
      - "--sd=/data/jetstream"
      - "--m=8222"
      # CR-02 (security audit): auth MANDATORY — brokerul respinge orice
      # client fără credențiale. Porturile rămân internal-only (agenții nu
      # vorbesc NATS deloc; bus-ul e backend↔compliance).
      - "--user=${NATS_USER:?NATS_USER required}"
      - "--pass=${NATS_PASSWORD:?NATS_PASSWORD required}"
    volumes:
      - nats_data:/data/jetstream
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          pids: 100
          cpus: "1"
          memory: 1G

  # ============================================================================
  # CACHE — Redis 7 (port internal-only)
  # ============================================================================

  redis:
    image: redis:7.4.9-alpine
    container_name: lokilinux-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-2gb}
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
    # REDISCLI_AUTH instead of `redis-cli -a`: avoids leaking the password
    # into the process list of every healthcheck invocation.
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          pids: 100
          cpus: "1"
          memory: 2G

  # ============================================================================
  # EVENT STORE — ClickHouse (raw events, signal occurrences, incident evidence)
  # ============================================================================

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: lokilinux-clickhouse
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-lokilinux}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  # ============================================================================
  # MIGRATION — rulează alembic upgrade head la fiecare deploy
  # ============================================================================

  lokilinux-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lokilinux-migrate
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    depends_on:
      pgbouncer:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
      BETTER_AUTH_URL: ${BETTER_AUTH_INTERNAL_URL:-http://lokilinux-frontend:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
    command: ["alembic", "upgrade", "head"]
    networks:
      - app-net

  # ============================================================================
  # CA-SIGNER — isolated CA signing (PKI Faza 4), UDS only, no network at all
  # ============================================================================

  lokilinux-ca-signer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: lokilinux/api:${LOKILINUX_VERSION:-0.3.0}
    container_name: lokilinux-ca-signer
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The private key that signs every agent identity in the fleet lives only
    # here — no app-net, no web-net, no egress-net, nothing. api/grpc reach
    # this process exclusively over the ca_signer_sock UDS volume below.
    network_mode: "none"
    environment:
      CA_KEY_PATH: /etc/lokilinux/ca-key/ca.key
      CA_CERT_PATH: /etc/lokilinux/certs/ca.crt
      CA_SIGNER_SOCKET_PATH: /run/lokilinux/ca-signer/sign.sock
    command:
      - python
      - -m
      - uvicorn
      - lokilinux.services.ca_signer_service:app
      - --uds
      - /run/lokilinux/ca-signer/sign.sock
    volumes:
      - ca_key_dir:/etc/lokilinux/ca-key:ro
      - certs_dir:/etc/lokilinux/certs:ro
      - ca_signer_sock:/run/lokilinux/ca-signer
    healthcheck:
      # No network stack (network_mode: none) — self-check dials the UDS
      # directly, same rationale as lokilinux-compliance's binary self-check.
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(3); s.connect('/run/lokilinux/ca-signer/sign.sock'); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          pids: 32
          cpus: "0.5"
          memory: 256M

  # ============================================================================
  # API — FastAPI REST (port 8000) + Prometheus metrics (port 9090)
  # ============================================================================

  lokilinux-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: lokilinux/api:${LOKILINUX_VERSION:-0.3.0}
    container_name: lokilinux-api
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      pgbouncer:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      lokilinux-migrate:
        condition: service_completed_successfully
      lokilinux-ca-signer:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
      NATS_URL: nats://${NATS_USER}:${NATS_PASSWORD}@nats:4222
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-lokilinux}
      EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-30}
      SIGNAL_OCCURRENCE_RETENTION_DAYS: ${SIGNAL_OCCURRENCE_RETENTION_DAYS:-90}
      INCIDENT_EVIDENCE_RETENTION_DAYS: ${INCIDENT_EVIDENCE_RETENTION_DAYS:-180}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      # Internal fallback: FastAPI fetches JWKS at {BETTER_AUTH_URL}/api/auth/jwks
      # from inside this container, where "localhost" would point at itself,
      # not the frontend. BETTER_AUTH_URL (public) stays localhost:3000 for
      # the frontend service below, which legitimately is that origin.
      BETTER_AUTH_URL: ${BETTER_AUTH_INTERNAL_URL:-http://lokilinux-frontend:3000}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      # Dual-trust during CA rotation (docs/security/CERTIFICATE_ROTATION.md):
      # bundle = CA_old + CA_new so agents on either cert generation verify.
      CA_CERT_PATH: /etc/lokilinux/certs/ca-bundle.crt
      # ca.key itself never mounts here — PKI Faza 4, signing goes through
      # lokilinux-ca-signer over this UDS (see services/ca_signer_client.py).
      CA_SIGNER_SOCKET_PATH: /run/lokilinux/ca-signer/sign.sock
      PLUGIN_DIR: /opt/lokilinux/plugins
      LOG_LEVEL: ${LOG_LEVEL:-info}
      POLICY_SIGNING_KEY_PATH: /var/lib/lokilinux/policy-key/policy-signing.key
      # Single public entry point — agent install URLs + CORS origin both derive from it.
      PLATFORM_URL: ${PUBLIC_URL:-http://localhost:3000}
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost:3000}
      AGENT_DOWNLOAD_BASE: ${AGENT_DOWNLOAD_BASE:-}
      AGENT_VERSION: ${AGENT_VERSION:-0.39.0}
    ports:
      - "8000:8000"
      - "9090:9090"
    volumes:
      - certs_dir:/etc/lokilinux/certs:ro
      - ca_signer_sock:/run/lokilinux/ca-signer
      - plugins_dir:/opt/lokilinux/plugins
      - ./logs/api:/var/log/lokilinux
      - ./agent/bin:/opt/lokilinux/packages:ro
      # Desired-state policy signing key (agent-policy-modernization plan):
      # ed25519 private half lives in its own named volume; generated on
      # first start, public half served at /agent/policy-signing-key.
      - policy_key:/var/lib/lokilinux/policy-key
    networks:
      - app-net
      - web-net
      - egress-net
    healthcheck:
      # Image ships without curl (hardened); use Python stdlib.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          pids: 256
          cpus: "2"
          memory: 2G

  # ============================================================================
  # gRPC SERVER — FastAPI + grpcio (port 50051, mTLS)
  # ============================================================================

  lokilinux-grpc:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: lokilinux/api:${LOKILINUX_VERSION:-0.3.0}
    container_name: lokilinux-grpc
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      pgbouncer:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
      lokilinux-ca-signer:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
      NATS_URL: nats://${NATS_USER}:${NATS_PASSWORD}@nats:4222
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      GRPC_PORT: ${GRPC_PORT:-50051}
      # Dual-trust during CA rotation — same bundle as the api service.
      CA_CERT_PATH: /etc/lokilinux/certs/ca-bundle.crt
      # ca.key never mounts here — see lokilinux-api's CA_SIGNER_SOCKET_PATH comment.
      CA_SIGNER_SOCKET_PATH: /run/lokilinux/ca-signer/sign.sock
      SERVER_CERT_PATH: /etc/lokilinux/certs/server.crt
      SERVER_KEY_PATH: /etc/lokilinux/certs/server.key
      # Required by Settings (Better Auth hardening) — without these the gRPC
      # servicer 500s every heartbeat with a Settings ValidationError.
      BETTER_AUTH_URL: ${BETTER_AUTH_INTERNAL_URL:-http://lokilinux-frontend:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_ENABLED: "true"
      METRICS_PORT: "9091"
    command: ["python", "-m", "lokilinux.grpc_server"]
    ports:
      - "50051:50051"
    volumes:
      - certs_dir:/etc/lokilinux/certs:ro
      - ca_signer_sock:/run/lokilinux/ca-signer
    networks:
      - app-net
      - gateway-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(3); s.connect(('127.0.0.1',50051)); s.close()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          pids: 128
          cpus: "2"
          memory: 2G

  # ============================================================================
  # COMPLIANCE — Go microservice (drift/policy/scoring engine), no public port
  # ============================================================================

  lokilinux-compliance:
    build:
      context: ./services/compliance
      dockerfile: Dockerfile
      # Stamps the binary's self-reported version (main.Version via -ldflags
      # in the Dockerfile). Without this arg it would always report "dev".
      args:
        VERSION: ${LOKILINUX_VERSION:-0.3.0}
    image: lokilinux/compliance:${LOKILINUX_VERSION:-0.3.0}
    container_name: lokilinux-compliance
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      pgbouncer:
        condition: service_healthy
      nats:
        condition: service_healthy
      lokilinux-migrate:
        condition: service_completed_successfully
    environment:
      # DSN keyword=value form, not a postgresql:// URI: POSTGRES_PASSWORD is
      # a generated secret that can contain characters (/, =, +) a URI parser
      # treats as delimiters, which would need percent-encoding to use safely
      # in the postgresql:// form pgxpool.New() also accepts. Confirmed by a
      # real hang (context deadline exceeded on Ping) against this exact
      # POSTGRES_PASSWORD when this was still the URI form.
      DATABASE_URL: "host=pgbouncer port=5432 user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB}"
      NATS_URL: nats://${NATS_USER}:${NATS_PASSWORD}@nats:4222
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - certs_dir:/etc/lokilinux/certs:ro
    networks:
      - app-net
    healthcheck:
      # gcr.io/distroless/static-debian12 has no shell, no wget/curl — the
      # binary checks itself instead (cmd/compliance/main.go -healthcheck).
      # Confirmed by a real crash-loop otherwise: "wget: executable file
      # not found in $PATH" on the first-ever docker-compose deploy of this
      # service, while the app itself was fully up (connected to NATS/DB,
      # consumer+scheduler running) the whole time.
      test: ["CMD", "/lokilinux-compliance", "-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          pids: 64
          cpus: "2"
          memory: 2G

  # ============================================================================
  # FRONTEND — Nuxt 4 (port 3000)
  # ============================================================================

  lokilinux-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_API_BASE: /api/v1
    image: lokilinux/frontend:${LOKILINUX_VERSION:-0.3.0}
    container_name: lokilinux-frontend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      lokilinux-api:
        condition: service_healthy
    environment:
      # Client apiBase = relative (same-origin proxy); SSR uses API_INTERNAL_URL.
      NUXT_PUBLIC_API_BASE: /api/v1
      API_INTERNAL_URL: http://lokilinux-api:8000
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "3000:3000"
    networks:
      - web-net
      - data-net
      - gateway-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          pids: 128
          cpus: "0.5"
          memory: 512M

# ============================================================================
# NETWORKS — see header comment for the segmentation map
# ============================================================================

networks:
  data-net:
    name: lokilinux-data-net
    driver: bridge
    internal: true
  app-net:
    name: lokilinux-app-net
    driver: bridge
    internal: true
  web-net:
    name: lokilinux-web-net
    driver: bridge
    internal: true
  gateway-net:
    name: lokilinux-gateway-net
    driver: bridge
  egress-net:
    name: lokilinux-egress-net
    driver: bridge

# ============================================================================
# VOLUMES
# ============================================================================

volumes:
  postgres_data:
    name: lokilinux-postgres-data
  nats_data:
    name: lokilinux-nats-data
  redis_data:
    name: lokilinux-redis-data
  clickhouse_data:
    name: lokilinux-clickhouse-data
  plugins_dir:
    name: lokilinux-plugins
  certs_dir:
    name: lokilinux-certs
  ca_key_dir:
    name: lokilinux-ca-key
  ca_signer_sock:
    name: lokilinux-ca-signer-sock
  policy_key:
    name: lokilinux-policy-key
