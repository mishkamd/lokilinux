# LokiLinux — Supply-chain security pipeline
#
# Source → Unit tests → Image build → Vulnerability scan (fail on HIGH/CRIT)
#        → SBOM → Image signing → Registry
#
# Prerequisites (repo secrets):
#   REGISTRY_USER / REGISTRY_TOKEN — push credentials
#   COSIGN_KEY / COSIGN_PASSWORD   — cosign signing key (or use keyless)

name: security-pipeline

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  PLATFORM_VERSION: "0.3.0"

permissions:
  contents: read
  packages: write
  id-token: write # cosign keyless signing

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Go unit tests. The agent stays on its declared 1.24 toolchain.
      # Compliance needs 1.25 (services/compliance/go.mod), so it gets its own step.
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - run: make agent-test
      # Informational: the -bench RSS budget is flaky on shared runners (fails
      # about a third of runs on unchanged code). TestBudgetGates still gates
      # through agent-test above, where it passes consistently.
      - name: agent-bench (informational, flaky RSS budget)
        continue-on-error: true
        run: make agent-bench
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/compliance/go.mod
      - run: make compliance-test

      # Python backend tests
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: uv.lock and Dockerfile pins match
        working-directory: backend
        run: |
          pip install uv
          uv lock --check
          python3 - <<'EOF'
          import re, tomllib
          norm = lambda n: re.sub(r"[-_.]+", "-", n).lower()
          lock = {norm(p["name"]): p["version"] for p in tomllib.load(open("uv.lock", "rb"))["package"]}
          pins = re.findall(r"([A-Za-z0-9._-]+)(?:\[[^\]]*\])?==([0-9][0-9A-Za-z.+!-]*)", open("Dockerfile").read())
          bad = [f"{n}=={v} (uv.lock has {lock[norm(n)]})" for n, v in pins if norm(n) in lock and lock[norm(n)] != v]
          print("\n".join(bad) or "Dockerfile pins match uv.lock")
          raise SystemExit(bool(bad))
          EOF

      - name: Install backend dev deps and run tests
        working-directory: backend
        # CI has no backend/.env, so Settings needs its required fields here.
        # database_url is swapped for the test container by conftest.py.
        env:
          BETTER_AUTH_URL: http://localhost:3000
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
          .venv/bin/pytest tests/

  # Frontend: design-system guard, type check, unit tests. The guard is the
  # reason a raw hex or a palette color can't reach main — it is cheaper than
  # ESLint for these rules and needs no dependency.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install
        working-directory: frontend
        run: npm ci
      - name: design-system guard
        working-directory: frontend
        run: npm run lint
      - name: type check
        working-directory: frontend
        run: npm run typecheck
      - name: unit tests
        working-directory: frontend
        run: npm test

  # Secret, SAST and dependency scans (ROADMAP P2, CI security scanning).
  # Fails on findings: triage the current advisories before merging to main.
  secrets-and-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tree

      - name: gitleaks (secrets)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: semgrep (SAST)
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep \
            semgrep scan --config p/default --error --severity ERROR

      - uses: actions/setup-python@v5
        if: always()
        with:
          python-version: "3.11"
      - name: pip-audit (locked production set)
        if: always()
        working-directory: backend
        run: |
          pip install uv pip-audit
          # What the lock ships, not what `pip install -e` resolves today.
          uv export --frozen --no-dev --no-hashes --no-emit-project -o /tmp/prod-reqs.txt
          pip-audit -r /tmp/prod-reqs.txt

      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: "22"
      - name: npm audit (frontend production dependencies)
        if: always()
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          # Gate on critical only. The remaining high advisories sit in the Nuxt
          # chain and have no non-breaking fix; revisit when Nuxt ships one.
          npm audit --audit-level=critical --omit=dev

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - { name: api, context: ./backend, dockerfile: ./backend/Dockerfile }
          - { name: frontend, context: ./frontend, dockerfile: ./frontend/Dockerfile }
          - { name: compliance, context: ./services/compliance, dockerfile: ./services/compliance/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: false
          load: true
          tags: lokilinux/${{ matrix.image.name }}:${{ env.PLATFORM_VERSION }}
          build-args: VERSION=${{ env.PLATFORM_VERSION }}

      - name: Vulnerability gate (fails on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          # v0.65.0 (the action's default) has no Linux tarball on its release, so
          # setup-trivy 404s; v0.76.0 is the first release with one.
          version: v0.76.0
          image-ref: lokilinux/${{ matrix.image.name }}:${{ env.PLATFORM_VERSION }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          version: v0.76.0
          image-ref: lokilinux/${{ matrix.image.name }}:${{ env.PLATFORM_VERSION }}
          format: cyclonedx
          output: sbom-${{ matrix.image.name }}.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.image.name }}
          path: sbom-${{ matrix.image.name }}.cdx.json

      # ── Publish + sign only on main/tags (not PRs) ──
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          docker tag lokilinux/${{ matrix.image.name }}:${{ env.PLATFORM_VERSION }} \
            ghcr.io/${{ github.repository_owner }}/lokilinux-${{ matrix.image.name }}:${{ env.PLATFORM_VERSION }}
          docker push ghcr.io/${{ github.repository_owner }}/lokilinux-${{ matrix.image.name }}:${{ env.PLATFORM_VERSION }}

      - name: Sign image (cosign keyless)
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3
      - run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/lokilinux-${{ matrix.image.name }}@$(docker inspect --format '{{index .RepoDigests 0}}' ghcr.io/${{ github.repository_owner }}/lokilinux-${{ matrix.image.name }}:${{ env.PLATFORM_VERSION }} | cut -d@ -f2) || true
