[project]
name = "lokilinux"
version = "0.5.0"
description = "Enterprise Linux Operations Platform"
requires-python = ">=3.11"

dependencies = [
    # Core FastAPI
    "fastapi==0.138.1",
    "uvicorn[standard]==0.49.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",

    # Database (psycopg3 async)
    "sqlalchemy[asyncio]==2.0.51",
    "psycopg[async,binary]==3.3.4",
    "alembic==1.18.5",

    # Cache
    "redis[hiredis]==8.0.1",

    # Message bus
    "nats-py==2.15.0",

    # Event store (observability pipeline)
    "clickhouse-connect==1.7.2",

    # OTLP ingestion (Task G1) — protobuf message defs only, no SDK/exporter
    "opentelemetry-proto==1.44.0",

    # gRPC / agent communication
    "grpcio==1.81.1",
    "protobuf==6.33.5",

    # Auth (JWKS validation against Better Auth — opaque session tokens, no JWT)
    "httpx==0.28.1",
    "cryptography==46.0.3",  # direct dependency — api/v1/routers/agent_install.py imports cryptography.x509 itself

    # Observability
    "structlog==26.1.0",

    # Compliance Reporting Engine — XLSX/PDF export
    "openpyxl==3.1.5",
    "reportlab==5.0.0",

    # Policy Engine — cron trigger scheduling
    "croniter==6.2.4",
    "prometheus-client==0.21.1",

    # Compliance — curated rule content loader (F10)
    "PyYAML==6.0.3",

    # Object storage — RustFS/S3-compatible (Centralized S3 Object Storage plan)
    "boto3==1.43.87",
    "python-multipart==0.0.32",  # required by fastapi.UploadFile
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "black==26.5.1",
    "ruff==0.15.20",
    "mypy==2.1.0",
    "testcontainers==4.13.1",
    "psycopg2-binary==2.9.12",  # testcontainers Postgres readiness check uses the sync driver
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lokilinux*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
