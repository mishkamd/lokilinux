[project]
name = "lokilinux"
version = "0.1.0"
description = "Enterprise Linux fleet management platform"
requires-python = ">=3.11"

dependencies = [
    # Core FastAPI
    "fastapi==0.138.1",
    "uvicorn[standard]==0.49.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "orjson==3.11.9",
    "python-multipart==0.0.32",

    # Database (psycopg3 async)
    "sqlalchemy[asyncio]==2.0.51",
    "psycopg[async,binary]==3.3.4",
    "alembic==1.18.5",

    # Cache
    "redis[hiredis]==8.0.1",

    # Message bus
    "nats-py==2.15.0",

    # gRPC / agent communication
    "grpcio==1.81.1",
    "grpcio-tools==1.81.1",
    "protobuf==6.33.5",

    # Auth (JWKS validation against Better Auth)
    "httpx==0.28.1",
    "PyJWT[cryptography]==2.13.0",

    # Observability
    "structlog==26.1.0",

    # Static file serving (agent packages)
    "aiofiles==25.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "black==26.5.1",
    "ruff==0.15.20",
    "mypy==2.1.0",
    "testcontainers==4.13.1",
    "psycopg2-binary==2.9.12",  # testcontainers Postgres readiness check uses the sync driver
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]
include = ["lokilinux*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
